name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - name: Build reviewed DNS tunnel engine for Android ARM64
        run: |
          git clone https://github.com/OutlineFoundation/dnstt.git /tmp/dnstt
          git -C /tmp/dnstt checkout e1af37b31a778cab0166788fe2549169f345d742
          NDK="$ANDROID_NDK_LATEST_HOME"
          CC="$(find "$NDK/toolchains/llvm/prebuilt" -type f -name aarch64-linux-android24-clang -print -quit)"
          test -x "$CC"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/dnstt
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" \
            go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdnstt.so" ./dnstt-client
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdnstt.so"
          readelf -h "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdnstt.so" | grep AArch64
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SlowDNS-Lite-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
